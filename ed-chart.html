<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>急診結構化病歷</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 上方病人列+病歷類型切換 / 左側步驟 / 中間輸入表單 / 右側即時病歷預覽。表單內容由範本資料產生。 */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#18232d; --mute:#5d6b78; --line:#d9e0e6;
  --accent:#0b6e82; --accent-ink:#ffffff; --accent-soft:#dff0f3;
  --ok:#1b7f4c; --warn:#b26a00; --crit:#c0282d; --crit-soft:#fbe4e4; --warn-soft:#fff1d6;
  --t1:#c0282d; --t2:#e0662a; --t3:#e3b02a; --t4:#2f8f5b; --t5:#4f7fb8; --trauma:#a8321f; --pedi:#5b4bb4;
  --sans:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#18222b; --ink:#e6edf2; --mute:#9aa9b6; --line:#2a3743;
  --accent:#4cc2d6; --accent-ink:#06222a; --accent-soft:#143640;
  --ok:#5fd093; --warn:#f0b04a; --crit:#ff7b7f; --crit-soft:#3a1d20; --warn-soft:#3a2d12; --trauma:#ff9a85; --pedi:#b7a8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222b; --ink:#e6edf2; --mute:#9aa9b6; --line:#2a3743;
  --accent:#4cc2d6; --accent-ink:#06222a; --accent-soft:#143640;
  --ok:#5fd093; --warn:#f0b04a; --crit:#ff7b7f; --crit-soft:#3a1d20; --warn-soft:#3a2d12; --trauma:#ff9a85; --pedi:#b7a8ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.banner .name{font-size:17px;font-weight:700}
.banner .meta{color:var(--mute);font-size:13px;display:flex;gap:4px 14px;flex-wrap:wrap}
.banner .grow{flex:1}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--mute)}
.tri{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:3px 12px;border-radius:6px;color:#fff;background:var(--mute)}
.tri[data-l="1"]{background:var(--t1)}.tri[data-l="2"]{background:var(--t2)}.tri[data-l="3"]{background:var(--t3);color:#2b2200}.tri[data-l="4"]{background:var(--t4)}.tri[data-l="5"]{background:var(--t5)}
.modebar{display:flex;align-items:center;gap:8px}
.modebar>span{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.modebar .seg button{padding:7px 18px;font-weight:700}
.modebar .seg button.on{background:var(--accent);color:var(--accent-ink)}
.modebar .seg button.tr.on{background:var(--trauma);color:#fff}
.modebar .seg button.pd.on{background:var(--pedi);color:#fff}
.is-tr{--accent:var(--trauma)}
.is-pd{--accent:var(--pedi)}

.kb{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 70px);right:16px;width:min(360px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.kb dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:10px 0 0}
.kb dt{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap;align-self:start}
.kb dd{margin:0}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nlrows{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:4px 14px;margin:0}
.nlrows dt{color:var(--mute);font-size:12px;font-weight:700;padding-top:2px}
.nlrows dd{margin:0}
.cntbox{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--bg)}
.negs summary{cursor:pointer;color:var(--mute);font-size:12px;margin-top:6px}
.oin{width:100%;max-width:420px;margin-top:6px}
.chip.pk{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.wrap{display:grid;grid-template-columns:170px minmax(0,1fr) 390px;gap:16px;padding:16px;align-items:start}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:2px}
nav.steps a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav.steps a:hover{background:var(--accent-soft)}
nav.steps a.act{background:var(--accent-soft);color:var(--accent)}
nav.steps i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;font-style:normal}
nav.steps a.done i{background:var(--ok);border-color:var(--ok);color:#fff}
nav.steps a.part i{border-color:var(--warn)}
.prog{margin-top:12px;font-size:12px;color:var(--mute);padding:0 10px}
.prog div{height:5px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.prog div span{display:block;height:100%;background:var(--ok);transition:width .2s}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;scroll-margin-top:90px}
section.card>h2{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
section.card>h2 small{font-weight:400;color:var(--mute);font-size:12px}
.f{margin-bottom:14px}
.f>label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em;margin-bottom:6px}
.grp{font-size:12px;color:var(--mute);margin:10px 0 4px}
.grp:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;line-height:1.3;min-height:32px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.neg{background:var(--crit-soft);border-color:var(--crit);color:var(--crit);text-decoration:line-through}
.chip.on.ab{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.on.hr{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.chip small{opacity:.7;font-family:var(--mono);margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.sub{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.sub>h3{margin:0 0 8px;font-size:13px}
.sub .f:last-child{margin-bottom:0}
.sub .f>label{font-weight:500}

.nrs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.nrs button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 0;font-family:var(--mono)}
.nrs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.pe{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.pe.first{border-top:0}
.pe .sys{font-weight:700;padding-top:4px}
.pe .fx{margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.n.on{background:var(--ok);color:#fff}.seg button.a.on{background:var(--warn);color:#fff}
details.more{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;color:var(--mute);padding:4px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.gcs{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.gcs .tot{font-family:var(--mono);font-size:22px;font-weight:500;padding-bottom:4px}

.dx{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.dx div{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.dx div b{flex:1;min-width:0;font-weight:500}.dx .pri{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 6px}
.dx button{border:0;background:none;color:var(--mute)}
.none{color:var(--mute);padding:8px 0}

aside.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button .n{background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
.pane{padding:14px;overflow:auto;flex:1;min-height:200px}
.note h4{margin:12px 0 2px;font-size:12px;letter-spacing:.06em;color:var(--accent)}
.note h4:first-child{margin-top:0}
.note p{margin:0;white-space:pre-wrap}
.note .empty{color:var(--mute)}
pre.json{margin:0;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all}
.alert{border-radius:8px;padding:9px 12px;margin-bottom:8px;border:1px solid}
.alert.crit{background:var(--crit-soft);border-color:var(--crit)}.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert b{display:block}
.foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.foot .btn{flex:1}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}

@media (max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr) 340px}nav.steps{display:none}}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside.out{position:static;max-height:none}
  .banner{position:static}
  .pe{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="root">
<header class="banner">
  <div><div class="name">急診結構化病歷</div><div class="meta"><span id="ptAge"></span></div></div>
  <div class="grow"></div>
  <div class="modebar"><span>病歷類型</span><div class="seg" id="modeSeg"><button type="button" class="nt" data-mode="nt">非外傷</button><button type="button" class="tr" data-mode="tr">外傷</button><button type="button" class="pd" data-mode="pd">小兒</button></div></div>
  <button type="button" class="btn" id="kbBtn" aria-controls="kb">快速鍵 ?</button>
  <div id="triBadge"></div>
</header>
<div id="kb" class="kb" hidden>
  <b>鍵盤快速鍵</b>
  <dl>
   <dt>Alt+1 ~ 5</dt><dd>跳到第 1 ~ 5 個區塊</dd>
   <dt>Alt+A</dt><dd>優先系統全部設為正常（外傷：未填部位設為無傷）</dd>
   <dt>Alt+P</dt><dd>套用第一個快速組合（外傷：ABCDE 常見正常值）</dd>
   <dt>Alt+D</dt><dd>跳到診斷搜尋</dd>
   <dt>Alt+T</dt><dd>依序切換非外傷 / 外傷 / 小兒</dd>
   <dt>Alt+I</dt><dd>跳到自然語言輸入（Ctrl+Enter 解析）</dd>
   <dt>Alt+C</dt><dd>複製病歷文字</dd>
   <dt>方向鍵</dt><dd>在選項間移動，空白鍵或 Enter 選取</dd>
   <dt>0 ~ 9</dt><dd>在現在病史區設定 NRS（連按 1、0 為 10）</dd>
   <dt>?</dt><dd>顯示或隱藏本說明，Esc 關閉</dd>
  </dl>
</div>
<div class="wrap">
  <nav class="steps" id="steps"></nav>
  <main><div id="nl"></div><div id="form"></div></main>

  </aside>
</div>
</div>
<div class="toast" id="toast"></div>

  add('有的症狀',r.sym_present);add('否認的症狀',r.sym_denied);Object.entries(r.ext).forEach(([l,v])=>add(l,v));add('過去病史',r.pmh);add('過敏',r.alg);add('個人史',r.soc);add('手術史',r.surg);if(r.tocc)add('TOCC',[['旅遊','t'],['職業','o'],['接觸','c'],['群聚','k']].map(([l,k])=>r.tocc[k]?l+' '+r.tocc[k]:'').filter(Boolean).join('；'));
  Object.entries(r.pe).forEach(([s,e])=>add('理學檢查：'+s,(e.st==='n'?'正常':e.st==='a'?'異常'+(e.f.length?'：'+e.f.join('、'):''):'')+((e.n||[]).length?(e.st?'；':'')+'陰性：'+e.n.join('、'):'')));add('診斷',r.dx.map(d=>d[0]))}
 else{if(r.pd){const q=r.pd;add('年齡',q.age?q.age.value+q.age.unit:'');add('性別',q.sex);add('體重',q.wt?q.wt+' kg':'')}add('外傷主訴',r.cc);add('受傷時間',r.time);add('受傷時間（描述）',r.when);add('機轉',r.moi);Object.entries(r.det).forEach(([m,d])=>add('細節：'+m,Object.entries(d).map(([l,v])=>l+' '+v)));add('意識喪失',r.loc);{const hp=Object.keys(r.hs||{}).filter(k=>r.hs[k]==1),hn=Object.keys(r.hs||{}).filter(k=>r.hs[k]==-1);add('頭部外傷篩檢：有',hp);add('頭部外傷篩檢：無',hn)}add('飲酒/藥物',r.alc);add('到院前處置',r.ems);
  Object.entries(r.abc).forEach(([k,v])=>add('初步評估：'+k,v));if(r.gcs)add('GCS',`E${r.gcs.e}V${r.gcs.v}M${r.gcs.m}=${+r.gcs.e+ +r.gcs.v+ +r.gcs.m}`);
  Object.entries(r.reg).forEach(([k,e])=>add('傷處：'+k,(e.st==='n'?'無傷':e.st==='a'?[...e.side,...e.site].join('')+(e.f.length?' '+e.f.join('、'):' 有傷'):'')+((e.n||[]).length?(e.st?'；':'')+'陰性：'+e.n.join('、'):'')));add('過去病史',r.pmh);add('過敏',r.alg);add('最後進食',r.meal);add('破傷風疫苗',r.teta);add('診斷',r.dx.map(d=>d[0]))}
 Object.entries(r.oth).forEach(([p,v])=>add('其他（'+p+'）',v));add('備註',r.note);return R}

const un=(a,b)=>[...new Set([...(a||[]),...b])];
function commit(r){
 Object.entries(r.oth).forEach(([p,v])=>addTo(S.oth,p,v));
 if(r.chart==='nt'){const h=S.hpi;
  if(r.cc.length)S.cc=[...r.cc];
  Object.assign(S.cnt,r.cnt||{});if(r.tocc)Object.assign(S.tocc,r.tocc);
  if(r.pd){const q=r.pd,P=pi();if(q.age){P.age=String(q.age.value);P.unit=q.age.unit}['sex','wt','ga','vax','dev','feed','care'].forEach(k=>{if(q[k])P[k]=q[k]})}
  if(r.onset){h.on=String(r.onset.value);h.unit=r.onset.unit}if(r.course)h.course=r.course;if(r.nrs!=null)h.nrs=r.nrs;if(r.side)h.side=r.side;
  h.loc=un(h.loc,r.loc);h.q=un(h.q,r.q);r.sym_present.forEach(s=>h.sym[s]=1);r.sym_denied.forEach(s=>h.sym[s]=-1);Object.assign(h.ext,r.ext);
  const ex=(k,v)=>{if(!v.length)return;S[k]=un(S[k],v);if(EXCL[k]){if(v.includes(EXCL[k]))S[k]=[EXCL[k]];else S[k]=S[k].filter(x=>x!==EXCL[k])}};
  ex('pmh',r.pmh);ex('alg',r.alg);ex('soc',r.soc);if(r.surg)S.surg=r.surg;
  Object.entries(r.pe).forEach(([s,e])=>{const o=S.pe[s]||{},n=un(o.n,e.n||[]);if(e.st==='a')S.pe[s]={st:'a',f:un(o.f,e.f),n};else if(e.st==='n')S.pe[s]=o.st==='a'?{...o,n}:{st:'n',n};else S.pe[s]={...o,st:o.st||'',n}});
  if(r.note)h.note=[h.note,r.note].filter(Boolean).join('；');
  r.dx.forEach(d=>addDx(d[0],d[1]));prune()}
 else{const t=S.tr;
  if(r.pd){const q=r.pd,P=pi();if(q.age){P.age=String(q.age.value);P.unit=q.age.unit}['sex','wt'].forEach(k=>{if(q[k])P[k]=q[k]})}
  t.cc=un(t.cc,r.cc);if(r.time)t.time=r.time;if(r.when)t.when=r.when;t.moi=un(t.moi,r.moi);Object.entries(r.det).forEach(([m,d])=>{t.det[m]=Object.assign(t.det[m]||{},d)});
  if(r.loc)t.loc=r.loc;if(r.alc)t.alc=r.alc;Object.assign(t.hs,r.hs||{});t.ems=un(t.ems,r.ems);Object.entries(r.abc).forEach(([k,v])=>{t.abc[k]=Array.isArray(v)?un(t.abc[k],v):v});if(r.gcs)t.gcs=r.gcs;
  Object.entries(r.reg).forEach(([k,e])=>{const o=t.reg[k]||{},n=un(o.n,e.n||[]);if(e.st==='a')t.reg[k]={st:'a',f:un(o.f,e.f),n,side:un(o.side,e.side),site:un(o.site,e.site)};else if(e.st==='n')t.reg[k]=o.st==='a'?{...o,n}:{st:'n',n};else t.reg[k]={...o,st:o.st||'',n}});
  S.pmh=un(S.pmh,r.pmh);S.alg=un(S.alg,r.alg);if(S.alg.includes('無已知過敏')&&S.alg.length>1)S.alg=S.alg.filter(x=>x!=='無已知過敏');if(r.meal)t.meal=r.meal;if(r.teta)t.teta=r.teta;
  r.dx.forEach(d=>addDx(d[0],d[1]))}}

/* ---------- 面板 ---------- */
let SMP=null,nlCtl=null;const NL={busy:false,msg:''};
Promise.resolve().then(()=>window.claude?.use?.('sample')).then(s=>{SMP=s||null;renderNL();schedTr()}).catch(()=>{SMP=null;renderNL()});
function renderNL(){const r=S.nlres,hasAi=!!SMP;
 $('#nl').innerHTML=`<section class="card" id="s-nl"><h2>自然語言輸入 <small>打一段話，轉成下方欄位（Alt+I，Ctrl+Enter 解析）</small></h2>
  <textarea id="nlText" rows="3" style="width:100%" placeholder="${Z('輸入病歷描述，中文或英文皆可','Type the case description, in Chinese or English')}">${esc(S.nl)}</textarea>
  <div class="row nlbar" style="margin-top:8px"><label class="hint">病歷類型 <select id="nlDept"><option value="" ${NL.dept?'':'selected'}>自動判斷</option><option value="nt" ${NL.dept==='nt'?'selected':''}>非外傷</option><option value="tr" ${NL.dept==='tr'?'selected':''}>外傷</option><option value="pd" ${NL.dept==='pd'?'selected':''}>小兒</option></select></label>${hasAi?`<button type="button" class="btn pri" id="nlAi" ${NL.busy?'disabled':''}>AI 解析</button>`:''}<button type="button" class="btn ${hasAi?'':'pri'}" id="nlRule" ${NL.busy?'disabled':''}>${hasAi?'快速解析（不用 AI）':'解析'}</button>${hasAi?`<button type="button" class="btn" id="nlStop" ${NL.busy?'':'hidden'}>停止</button>`:''}
  <span class="hint" id="nlStat">${esc(NL.msg||(hasAi?Z('AI 解析較完整，快速解析只比對選項字詞。','AI parsing is more complete. Quick parse only matches option words.'):''))}</span></div>
  ${r?`<div class="sub" style="margin-top:12px"><h3>解析結果：請確認後再套用（只會填入下列欄位，其他欄位不變）</h3>${rowsOf(r).length?`<dl class="nlrows">${rowsOf(r).map(([l,v])=>`<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:'<div class="none">沒有解析到可填入的內容。</div>'}
   <div class="row" style="margin-top:10px"><button type="button" class="btn pri" id="nlApply" ${rowsOf(r).length?'':'disabled'}>套用到病歷</button><button type="button" class="btn" id="nlCancel">放棄</button></div></div>`:''}</section>`}
function nlDone(r,via){
 S.nlres=r;NL.busy=false;NL.msg=Z(via+'完成，請確認結果。',via+' finished. Please review the result.');renderNL()}
function runRule(){const t=S.nl.trim();if(!t){NL.msg=Z('請先輸入文字。','Please enter some text first.');renderNL();return}
 autoMode(t);
 nlDone(isTr()?ruleTr(t):ruleNt(t),Z('快速解析','Quick parse'))}
const PEDS_RE=/小兒|嬰兒|幼兒|小孩|新生兒|寶寶|男童|女童|(\d+(?:\.\d+)?)\s*(?:個月|月大|週大|天大)|\b(?:pediatric|paediatric|infant|toddler|newborn|neonate|baby|\d+\s*(?:-|\s)?(?:month|mo|week|wk|day)s?[- ]old|\d+\s*(?:months?|mos)\b)/i;
const ageYears=t=>{const m=t.match(/(\d+)\s*(?:歲|[- ]?years?[- ]?old|\s?y\/?o\b|\s?yrs?\b)/i)||t.match(/\b(\d{1,3})\s?(?:[MF](?!\s*height)\b|\/\s?[MFmf]\b)/);return m?+m[1]:null};
const PEDS_WEAK=/\bTOCC\b|\bactivity\b|\bappetite\b|\bNSD\b|\bBW\s*\d/i;
function detectMode(t){if(TRAUMA_RE.test(t))return 'tr';const y=ageYears(t);if(PEDS_RE.test(t))return 'pd';if(y!=null)return y<18?'pd':'adult';if(PEDS_WEAK.test(t))return 'pd';return null}
/* 只在內容明顯屬於另一種病歷時才切換：外傷、小兒線索會切過去；在外傷或小兒病歷裡沒有線索時留在原處 */
function autoMode(t){if(NL.dept){if(S.mode!==NL.dept)setMode(NL.dept);return}const d=detectMode(t);let m=S.mode;
 if(d==='tr')m='tr';else if(d==='pd'&&S.mode==='nt')m='pd';else if(d==='adult'&&S.mode==='pd')m='nt';
 if(m===S.mode)return;setMode(m);
 toast(m==='tr'?Z('內容像外傷，已切換到外傷病歷','Looks like trauma. Switched to the trauma chart.'):m==='pd'?Z('內容像小兒個案，已切換到小兒病歷','Looks like a pediatric case. Switched to the pediatric chart.'):Z('已切換到非外傷病歷','Switched to the non-trauma chart.'))}
const TRAUMA_RE=/\bTA\b|滑倒|\bsuture\b|plasty|ecchymos\w*|\bwound\b|\bcut\b|knife|\bhit by\b|被打|被砍|\bkicked\b|\bpunched\b|\bMVA\b|\bs\/p fall|\bslipped\b|\blaceration\b|\babrasion\b|\bcontusion\b|扭傷|扭到|拉傷|骨折|脫臼|挫傷|擦傷|撕裂傷|\b(?:sprain(?:ed)?|fracture[ds]?|dislocat\w+|contusion|bruis\w+|abrasion)\b|塞進|塞入|塞到|珠子|豆子|車禍|機車|自摔|撞|墜落|摔|跌倒|跌落|割傷|刺傷|砍|燒燙|燙傷|咬傷|外傷|壓傷|砸|爆炸|槍|魚刺|魚骨|魚鯁|異物|電焊|焊接|雪盲|紫外線|濺入|濺到|卡到|卡在|吞入|誤吞|鐵屑|\b(?:crash|collision|mvc|accident|fell|fall from|ground-level fall|stab(?:bed)?|laceration|burn(?:ed)?|scald|bite[nd]?|bitten|assault(?:ed)?|gunshot|blast|trauma|injur(?:y|ed)|crush(?:ed)?|struck|thrown|ejected|fish ?bone|foreign body|welding|welder|arc eye|flash burn|snow blindness|splash(?:ed)?|swallowed|stuck in)\b/i;
async function runAi(){const t=S.nl.trim();if(!t){NL.msg=Z('請先輸入文字。','Please enter some text first.');renderNL();return}if(!SMP)return;
 autoMode(t);
 nlCtl=new AbortController();NL.busy=true;NL.msg=Z('AI 解析中…','AI is parsing…');renderNL();
 try{const raw=await SMP.json(aiPrompt(t),{signal:nlCtl.signal,modelTier:'default',cache:false});
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw {code:'invalid_json'};
  nlDone(isTr()?normTr(raw):normNt(raw),Z('AI 解析','AI parse'))}
 catch(e){NL.busy=false;const c=e&&e.code;NL.msg=c==='cancelled'?Z('已停止。','Stopped.'):c==='not_granted'||c==='sampling_disabled'?Z('未允許使用 AI，請改用快速解析。','AI use was not allowed. Please use quick parse.'):c==='rate_limited'?Z('使用太頻繁，請稍後再試，或改用快速解析。','Too many requests. Try again later or use quick parse.'):c==='invalid_json'?Z('AI 回覆格式無法讀取，請再試一次或改用快速解析。','Could not read the AI reply. Try again or use quick parse.'):Z('AI 解析失敗，請再試一次或改用快速解析。','AI parsing failed. Try again or use quick parse.');renderNL()}
 finally{nlCtl=null}}
document.addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(!id)return;
 if(id==='nlAi')runAi();else if(id==='nlRule')runRule();else if(id==='nlStop')nlCtl?.abort();
 else if(id==='nlCancel'){S.nlres=null;NL.msg='';renderNL()}
 else if(id==='nlApply'&&S.nlres){const n=rowsOf(S.nlres).length;commit(S.nlres);S.nlres=null;NL.msg=Z('已套用 '+n+' 項，請檢查下方欄位。','Applied '+n+' item(s). Please check the fields below.');rebuild();update();renderNL();toast(Z('已套用 '+n+' 項','Applied '+n+' item(s)'))}});
document.addEventListener('input',e=>{if(e.target.id==='nlText')S.nl=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='nlDept'){NL.dept=e.target.value;if(NL.dept&&S.mode!==NL.dept){setMode(NL.dept);toast(Z('已切換病歷類型','Chart type switched'))}}});
document.addEventListener('keydown',e=>{if(e.target.id==='nlText'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();SMP?runAi():runRule()}});

/* ---------- 鍵盤快速鍵 ---------- */
const typing=el=>el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
let lastDigit=0;
function jump(i){const k=STEPS[S.mode][i]?.[0],el=k&&$('#s-'+k);if(!el)return;el.scrollIntoView({block:'start'});el.querySelector('button.chip,.seg button,input,select,textarea')?.focus({preventScroll:true})}
function doAllN(){const root=isTr()?'tr.reg':'pe',list=isTr()?regPrio():prio();list.forEach(s=>{if(!get(root+'.'+s)?.st)setp(root+'.'+s,{...(get(root+'.'+s)||{}),st:'n'})});rebuild();update();toast(isTr()?Z('未填部位已設為無傷','Unfilled regions set to no injury'):Z('優先系統已設為正常','Priority systems set to normal'))}
function doPack(){if(isTr()){applyAbc();rebuild();update();toast(Z('已帶入常見正常值，請確認頸椎、eFAST 與 E','Typical normal values filled in. Please check C-spine, eFAST and E.'));return}
 const c=S.cc.find(x=>PACK[x]);if(!c){toast(Z('此主訴沒有快速組合','No quick pack for this complaint'));return}const n=applyPack(c,0);rebuild();update();toast(Z('已套用「'+n+'」，請確認並修改','Applied "'+n+'". Please review and edit.'))}
document.addEventListener('keydown',e=>{
 const a=document.activeElement;
 if(e.altKey&&!e.ctrlKey&&!e.metaKey){const c=e.code;
  if(/^Digit[1-5]$/.test(c)){e.preventDefault();jump(+c.slice(5)-1);return}
  if(c==='KeyA'){e.preventDefault();doAllN();return}
  if(c==='KeyP'){e.preventDefault();doPack();return}
  if(c==='KeyD'){e.preventDefault();$('#s-dx').scrollIntoView();$('#dxFree')?.focus();return}
  if(c==='KeyT'){e.preventDefault();setMode({nt:'tr',tr:'pd',pd:'nt'}[S.mode]);return}
  if(c==='KeyC'){e.preventDefault();flushTr().then(()=>copy(noteText(),Z('已複製病歷文字','Note text copied')));return}
  if(c==='KeyI'){e.preventDefault();$('#nl').scrollIntoView();$('#nlText')?.focus();return}}
 if(e.key==='Escape'){$('#kb').hidden=true;return}
 if(typing(a))return;
 if(e.key==='?'){$('#kb').hidden=!$('#kb').hidden;return}
 if(/^Arrow(Left|Right|Up|Down)$/.test(e.key)&&a&&a.matches('#form button')){
  const sib=[...a.parentElement.querySelectorAll('button')],i=sib.indexOf(a),n=sib[i+(/Left|Up/.test(e.key)?-1:1)];
  if(n){e.preventDefault();n.focus()}return}
 if(/^\d$/.test(e.key)&&!isTr()&&a&&a.closest('#s-hpi')&&document.querySelector('[data-act=nrs]')){
  const now=Date.now(),v=(lastDigit&&now-lastDigit<700&&S.hpi.nrs===1&&e.key==='0')?10:+e.key;lastDigit=now;
  S.hpi.nrs=v;rebuild();update();return}});
$('#kbBtn').onclick=()=>{$('#kb').hidden=!$('#kb').hidden};

/* ---------- 啟動 ---------- */
rebuild();update();renderNL();startObs();applyLang();
window.addEventListener('scroll',()=>{let cur_=null;STEPS[S.mode].forEach(([k])=>{const el=$('#s-'+k);if(el&&el.getBoundingClientRect().top<140)cur_=k});$$('#steps a').forEach(a=>a.classList.toggle('act',a.dataset.k===cur_))},{passive:true});
</script>

</body></html>
